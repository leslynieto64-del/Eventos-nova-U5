# Configuración de pytest para Eventos Nova (Unidad 5: Integración, Pruebas y Calidad).
#
# pytest es el ejecutor oficial de la suite. Las pruebas existentes están escritas con unittest.TestCase y pytest las ejecuta sin
# conversión (setUp/setUpClass, SkipTest y asserts de unittest se respetan). Las pruebas nuevas de la Unidad 5 usan el estilo nativo
# de pytest (funciones, fixtures y parametrize).
#
# - testpaths: la suite completa (incluida la prueba del ciclo TDD de la constancia única, ya en fase GREEN).
# - pythonpath: src (paquetes domain, application, infrastructure, api...) y tests (módulos de apoyo que las pruebas importan como
#   «test_reglas_corregidas», «apoyo_bd», etc.). Equivale a los sys.path.insert que ya hacen los propios archivos de prueba.
# - Las pruebas de integración con PostgreSQL siguen usando TEST_DATABASE_URL (base local terminada en «_test») y, con
#   EVENTOSNOVA_REQUIERE_BD=1, FALLAN si la base no está disponible en lugar de omitirse (tests/apoyo_bd.py).
# - La cobertura se pide en la línea de órdenes (--cov) y toma su configuración de .coveragerc (source = src, branch = True).
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = src tests
addopts = -ra --strict-markers --strict-config
