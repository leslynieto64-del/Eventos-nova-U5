# Integración continua de Eventos Nova (PIA: pipeline CI/CD activo, pruebas unitarias y de integración, cobertura >= 80 %).
#
# - pruebas : instala dependencias de forma reproducible, ejecuta el análisis estático (Ruff), valida las migraciones de Alembic, las
#             aplica a una base de PostgreSQL 18 efímera, ejecuta TODA la suite con pytest (unitarias + integración con PostgreSQL) con
#             cobertura y exige >= 80 % de sentencias en el total del proyecto, en src/domain y en src/application (Unidad 5).
#             El informe de cobertura (HTML y JSON) y el resultado JUnit de pytest se publican como artefacto aunque algo falle.
# - docker  : valida docker-compose.yml, construye las imágenes, ejecuta la suite dentro de Docker (servicio `tests`, también con
#             pytest) y comprueba que la API arranca sana contra la base de datos.
#
# Cualquier paso que falle hace fallar su job (bash con -e): pruebas en rojo, cobertura insuficiente, Ruff, migraciones o Docker.
#
# La contraseña de PostgreSQL de este archivo es de una base EFÍMERA que solo existe durante el job (no es un secreto de la
# aplicación). Los secretos reales nunca se escriben en el repositorio.
name: "Eventos Nova | Validación y CI — Unidad 5"
run-name: "${{ github.ref_name }} · ejecución #${{ github.run_number }} · ${{ github.event_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas automatizadas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eventosnova
          POSTGRES_PASSWORD: ci_clave_efimera
          POSTGRES_DB: eventosnova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventosnova -d eventosnova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://eventosnova:ci_clave_efimera@127.0.0.1:5432/eventosnova
      TEST_DATABASE_URL: postgresql+psycopg://eventosnova:ci_clave_efimera@127.0.0.1:5432/eventosnova_test
      EVENTOSNOVA_REQUIERE_BD: "1"          # sin PostgreSQL las pruebas de integración FALLAN (no se omiten)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Análisis estático (Ruff, ruff.toml)
        run: python -m ruff check src tests scripts migraciones

      - name: Migraciones — una sola cabeza y SQL offline
        run: |
          test "$(python -m alembic heads | wc -l)" = "1"
          python -m alembic history
          python -m alembic upgrade head --sql > /dev/null

      - name: Aplicar las migraciones a la base de desarrollo del job
        run: python -m alembic upgrade head

      - name: Preparar la base de pruebas (se crea si no existe y se migra)
        run: python scripts/preparar_base_de_pruebas.py

      - name: Suite completa con pytest y cobertura (unitarias + integración con PostgreSQL)
        run: >-
          python -m pytest
          --cov --cov-report=term-missing --cov-report=html:reportes/cobertura-html
          --cov-report=json:reportes/coverage.json --junitxml=reportes/pytest-junit.xml

      - name: Cobertura mínima (80 % de sentencias en el proyecto, src/domain y src/application)
        run: python scripts/verificar_cobertura.py reportes/coverage.json --minimo 80 --minimo-capa 80

      - name: Guardar el informe de cobertura y el resultado de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-y-pruebas
          path: |
            reportes/coverage.json
            reportes/cobertura-html/
            reportes/pytest-junit.xml
          if-no-files-found: warn

  docker:
    name: Construcción y validación Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env efímero (contraseña aleatoria, solo para este job)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Validar docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose config --services

      - name: Construir las imágenes
        run: docker compose --profile tests build

      - name: Ejecutar la suite completa dentro de Docker (servicio tests, pytest)
        run: docker compose run --rm tests

      - name: Levantar DB + migrate + API + worker y comprobar que están sanos
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs

      - name: Registros de los servicios (si algo falla)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Detener los servicios
        if: always()
        run: docker compose down
